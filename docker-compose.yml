services:
  postgres:
    image: postgres:17-alpine
    container_name: admingest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: admingest
      POSTGRES_USER: admingest
      POSTGRES_PASSWORD: admingest_dev
    ports:
      - "5432:5432"
    volumes:
      - admingest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admingest -d admingest"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  admingest_postgres_data:
