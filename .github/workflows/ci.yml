name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "sqlserver://localhost:1433;database=AdminGestDb;user=sa;password=AdminGest_CI_2026!;trustServerCertificate=true"
  JWT_SECRET: "AdminGest_CI_Secret_With_At_Least_32_Characters"
  CORS_ORIGIN: "http://localhost:5173"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Upload production builds
        uses: actions/upload-artifact@v4
        with:
          name: admingest-build-${{ github.sha }}
          path: |
            apps/api/dist
            apps/web/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "AdminGest_CI_2026!"
        ports:
          - 1433:1433

    env:
      SEED_ADMIN_PASSWORD: "AdminGest_E2E_2026!"
      E2E_PASSWORD: "AdminGest_E2E_2026!"
      E2E_EMAIL: "admin@example.test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Wait for SQL Server
        run: timeout 150 bash -c 'until </dev/tcp/127.0.0.1/1433; do sleep 3; done'

      - name: Create test database
        run: |
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          docker exec ${{ job.services.sqlserver.id }} test -x "$SQLCMD" || SQLCMD=/opt/mssql-tools/bin/sqlcmd
          docker exec ${{ job.services.sqlserver.id }} "$SQLCMD" \
            -S localhost -U sa -P "AdminGest_CI_2026!" -C \
            -Q "IF DB_ID('AdminGestDb') IS NULL CREATE DATABASE AdminGestDb"

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed

      - name: Build API
        run: npm run build --workspace @admingest/api

      - name: Start API
        run: npm run start:prod --workspace @admingest/api > api.log 2>&1 &

      - name: Run E2E smoke journey
        run: npm run test:e2e

      - name: Print API logs on failure
        if: failure()
        run: cat api.log || true
